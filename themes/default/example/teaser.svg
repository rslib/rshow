<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 152" width="800" height="152" role="img" aria-labelledby="teaser-title">
  <title id="teaser-title">A folder is published into a version, and the version is served through two links: a newest link that follows each publish and a pinned link that holds one version.</title>
  <style>
    text {
      font-family: "IBM Plex Sans", system-ui, -apple-system, "Segoe UI", sans-serif;
      letter-spacing: 0;
    }
    .box { fill: #f4f4f4; }
    .title { font-size: 17px; font-weight: 600; fill: #161616; }
    .sub { font-size: 13px; font-weight: 400; fill: #525252; }
    .note { font-size: 13px; font-weight: 400; fill: #525252; }
    .link { stroke: #0f62fe; stroke-width: 2; fill: none; }
    .head { fill: #0f62fe; }
    @media (prefers-color-scheme: dark) {
      .box { fill: #262626; }
      .title { fill: #f4f4f4; }
      .sub { fill: #c6c6c6; }
      .note { fill: #c6c6c6; }
      .link { stroke: #78a9ff; }
      .head { fill: #78a9ff; }
    }
  </style>

  <g>
    <rect class="box" x="0" y="20" width="160" height="100" />
    <rect class="box" x="196" y="20" width="160" height="100" />
    <rect class="box" x="392" y="20" width="160" height="100" />
    <rect class="box" x="600" y="16" width="192" height="56" />
    <rect class="box" x="600" y="88" width="192" height="56" />
  </g>

  <g>
    <text class="title" x="16" y="50">Folder</text>
    <text class="sub" x="16" y="74">deck, figure,</text>
    <text class="sub" x="16" y="92">notes, images</text>

    <text class="title" x="212" y="50">Publish</text>
    <text class="sub" x="212" y="74">hash, upload,</text>
    <text class="sub" x="212" y="92">record</text>

    <text class="title" x="408" y="50">Version</text>
    <text class="sub" x="408" y="74">bytes that</text>
    <text class="sub" x="408" y="92">never change</text>

    <text class="title" x="616" y="40">Newest link</text>
    <text class="sub" x="616" y="60">follows each publish</text>

    <text class="title" x="616" y="112">Pinned link</text>
    <text class="sub" x="616" y="132">holds one version</text>
  </g>

  <g class="link">
    <line x1="160" y1="70" x2="188" y2="70" marker-end="url(#teaser-head)" />
    <line x1="356" y1="70" x2="384" y2="70" marker-end="url(#teaser-head)" />
    <line x1="552" y1="70" x2="576" y2="70" />
    <line x1="576" y1="44" x2="576" y2="116" />
    <line x1="576" y1="44" x2="592" y2="44" marker-end="url(#teaser-head)" />
    <line x1="576" y1="116" x2="592" y2="116" marker-end="url(#teaser-head)" />
  </g>

  <defs>
    <marker id="teaser-head" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path class="head" d="M0 0 L10 5 L0 10 z" />
    </marker>
  </defs>
</svg>
