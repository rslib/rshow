name: CI

on:
  push:
    branches: [trunk]
  pull_request:
    branches: [trunk]
  workflow_dispatch:

# Every job only reads the repository.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Test
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - name: Install the workspace from the lockfile
        run: npm ci
      - name: Typecheck
        run: npm run typecheck
      - name: Test
        run: npm test
      - name: Build the worker bundle, the CLI bundle and the package
        run: npm run build
      - name: The built CLI prints its usage
        run: node packages/cli/dist/main.js --help
      - name: The default theme passes the page contract, offline
        run: node packages/cli/dist/main.js check themes/default --offline
      - name: install.sh installs the CLI, the skills and the hooks
        run: bash tests/install.test.sh
      - name: The packed package runs with no node_modules around it
        run: |
          set -eu
          npm pack -w rshow --pack-destination "$RUNNER_TEMP"
          smoke=$(mktemp -d "$RUNNER_TEMP/smoke.XXXXXX")
          tar -xzf "$RUNNER_TEMP"/rshow-*.tgz -C "$smoke"
          # The tarball must stand alone: no installed tree, no workspace links.
          if [ -e "$smoke/package/node_modules" ]; then
            echo "the packed package ships node_modules"
            exit 1
          fi
          cd "$smoke"
          node package/dist/main.js --help

  site:
    name: Docs site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: site/package-lock.json
      # site/package.json installs the theme from site/.theme, so fetch it first.
      - name: Fetch the pinned theme
        run: node site/scripts/fetch-theme.mjs
      - name: Install the site
        run: npm --prefix site ci
      # The build syncs the guides and the reference and runs the links validator.
      - name: Build the site
        run: npm --prefix site run build

  audit:
    name: Audit
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
      - name: No high or critical advisory in the root lockfile
        run: npm audit --audit-level=high
