name: Docs

on:
  push:
    branches: [trunk]
    paths:
      - "docs/**"
      - "site/**"
      - "README.md"
      - "themes/default/**"
      - "packages/cli/src/usage.ts"
      - ".github/workflows/docs.yml"
  workflow_dispatch:

permissions:
  contents: read

# Pages deployments queue behind each other; never cancel one half way.
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '26'
          cache: npm
          cache-dependency-path: site/package-lock.json
      # site/package.json installs the theme from site/.theme, so fetch it first.
      - name: Fetch the pinned theme
        run: node site/scripts/fetch-theme.mjs
      - name: Install the site
        run: npm --prefix site ci
      # The build syncs the guides and the reference and runs the links validator.
      - name: Build the site
        run: npm --prefix site run build
      - uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: site/dist

  deploy:
    name: Deploy
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@368f82528645a54fb793d4d04e342629a3f51346 # v5.0.1
